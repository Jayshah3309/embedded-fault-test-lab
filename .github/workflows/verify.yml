name: Verify fault lab
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test harness and negative paths
        run: python -m unittest discover -s tests -v
      - name: Run scenarios with undefined behavior checks and mutation controls
        run: python lab.py --sanitize --mutations
      - name: Preserve execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fault-lab-python-${{ matrix.python }}
          path: reports/
          if-no-files-found: warn
  uno:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.6
          arduino-cli compile --fqbn arduino:avr:uno firmware/fault_demo
